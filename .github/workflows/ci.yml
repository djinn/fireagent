name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_wheels:
        description: "Build platform wheels"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_UNIX_DEPS: "> /dev/null 2>&1 || true"

jobs:
  # ------------------------------------------------------------------
  # Lint
  # ------------------------------------------------------------------
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tools
        run: pip install black isort ruff mypy

      - name: Check formatting (black)
        run: black --check --diff src/ tests/ examples/

      - name: Check imports (isort)
        run: isort --check --diff --profile black src/ tests/ examples/

      - name: Lint (ruff)
        run: ruff check src/ tests/ examples/

  # ------------------------------------------------------------------
  # Test — matrix across Python versions and OS
  # ------------------------------------------------------------------
  test:
    name: "Test — ${{ matrix.os }}, Python ${{ matrix.python }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.10"
            coverage: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,test]"
          if [ "$RUNNER_OS" = "Linux" ]; then pip install ".[agent]" || true; fi

      - name: Run unit tests
        shell: bash
        run: |
          if [ "${{ matrix.coverage }}" = "true" ]; then
            pytest tests/unit/ -v --tb=short --cov=fireagent --cov=fireagent_api \
              --cov=fireagent_agent --cov=fireagent_guest --cov-report=xml
          else
            pytest tests/unit/ -v --tb=short --numprocesses auto
          fi

      - name: Run integration tests
        shell: bash
        run: pytest tests/integration/ -v --tb=short

      - name: Run property-based tests
        shell: bash
        run: pytest tests/unit/test_property.py -v --tb=short

      - name: Upload coverage
        if: matrix.coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ------------------------------------------------------------------
  # Security scan
  # ------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tools
        run: pip install bandit safety

      - name: Bandit SAST
        run: bandit -r src/ -x tests,examples -ll --format json --output bandit-report.json || true

      - name: Safety DB check
        run: safety check --full-report || true

  # ------------------------------------------------------------------
  # Docs build
  # ------------------------------------------------------------------
  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tools
        run: pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin mkdocs-glightbox pymdown-extensions

      - name: Build docs
        run: mkdocs build --strict

  # ------------------------------------------------------------------
  # Build source distribution
  # ------------------------------------------------------------------
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ------------------------------------------------------------------
  # Build wheel (on tag release or manual dispatch)
  #
  # Fireagent is pure Python (no compiled extensions). A single
  # `python -m build --wheel` produces a universal wheel that works
  # on Linux, macOS, and Windows. No cibuildwheel or manylinux needed.
  # ------------------------------------------------------------------
  wheel:
    name: Build wheel
    needs: [lint]
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_wheels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  # ------------------------------------------------------------------
  # Attach wheel + sdist to GitHub Release (on tag)
  # ------------------------------------------------------------------
  release:
    name: Attach wheel + sdist to release
    needs: [sdist, wheel]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist/
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz --clobber

  # ------------------------------------------------------------------
  # Summary
  # ------------------------------------------------------------------
  summary:
    name: "Summary"
    needs: [lint, test, security, docs, sdist, wheel, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| docs | ${{ needs.docs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| sdist | ${{ needs.sdist.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
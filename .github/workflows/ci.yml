name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_wheels:
        description: "Build platform wheels"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_UNIX_DEPS: "> /dev/null 2>&1 || true"

jobs:
  # ------------------------------------------------------------------
  # Lint
  # ------------------------------------------------------------------
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tools
        run: pip install black isort ruff mypy

      - name: Check formatting (black)
        run: black --check --diff src/ tests/ examples/

      - name: Check imports (isort)
        run: isort --check --diff --profile black src/ tests/ examples/

      - name: Lint (ruff)
        run: ruff check src/ tests/ examples/

  # ------------------------------------------------------------------
  # Test — matrix across Python versions and OS
  # ------------------------------------------------------------------
  test:
    name: "Test — ${{ matrix.os }}, Python ${{ matrix.python }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.10"
            coverage: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,test]"
          if [ "$RUNNER_OS" = "Linux" ]; then pip install ".[agent]" || true; fi

      - name: Run unit tests
        shell: bash
        run: |
          if [ "${{ matrix.coverage }}" = "true" ]; then
            pytest tests/unit/ -v --tb=short --cov=fireagent --cov=fireagent_api \
              --cov=fireagent_agent --cov=fireagent_guest --cov-report=xml
          else
            pytest tests/unit/ -v --tb=short --numprocesses auto
          fi

      - name: Run integration tests
        shell: bash
        run: pytest tests/integration/ -v --tb=short

      - name: Run property-based tests
        shell: bash
        run: pytest tests/unit/test_property.py -v --tb=short

      - name: Upload coverage
        if: matrix.coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ------------------------------------------------------------------
  # Security scan
  # ------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tools
        run: pip install bandit safety

      - name: Bandit SAST
        run: bandit -r src/ -x tests,examples -ll --format json --output bandit-report.json || true

      - name: Safety DB check
        run: safety check --full-report || true

  # ------------------------------------------------------------------
  # Docs build
  # ------------------------------------------------------------------
  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tools
        run: pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin mkdocs-glightbox pymdown-extensions

      - name: Build docs
        run: mkdocs build --strict

  # ------------------------------------------------------------------
  # Build source distribution
  # ------------------------------------------------------------------
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ------------------------------------------------------------------
  # Build platform wheels (on tag release or manual dispatch)
  #
  # NOTE: wheels does NOT depend on [test]. Tests run on every PR/merge,
  # but blocking wheel builds on test matrix completion (macOS, Windows)
  # causes tag releases to fail when a platform-specific test flakes.
  # The lint job provides sufficient gate for package integrity.
  # ------------------------------------------------------------------
  wheels:
    name: "Wheel — ${{ matrix.target }}"
    needs: [lint]
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_wheels)
    strategy:
      fail-fast: false
      matrix:
        include:
          # ─ Linux x86_64 (Intel) ─ native runner ─
          - target: linux-x86_64
            os: ubuntu-latest
            cibw_archs: "x86_64"

          # ─ Linux aarch64 (ARM64) ─ native ARM runner ─
          - target: linux-arm64
            os: ubuntu-24.04-arm
            cibw_archs: "aarch64"

          # ─ macOS x86_64 (Intel) ─ native Intel runner ─
          - target: macos-x86_64
            os: macos-13
            cibw_archs: "x86_64"

          # ─ macOS arm64 (Apple Silicon) ─ native ARM runner ─
          - target: macos-arm64
            os: macos-14
            cibw_archs: "arm64"

          # ─ Windows x86_64 ─
          - target: windows-x86_64
            os: windows-latest
            cibw_archs: "AMD64"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install cibuildwheel
        run: pip install cibuildwheel~=2.20 build

      - name: Build wheels
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          # Linux ARM64: use manylinux2014 image
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux2014"
          # macOS: delocate for library bundling
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-wheel -w {dest_dir} -v {wheel}"
          # Windows (no repair needed)
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""
        run: |
          # Set up QEMU for Linux ARM64 if running on x86_64 host
          if [[ "${{ matrix.target }}" == "linux-arm64" && "$(uname -m)" != "aarch64" ]]; then
            docker run --rm --privileged multiarch/qemu-user-static --reset -p yes 2>/dev/null || true
          fi
          mkdir -p wheelhouse
          cibuildwheel --output-dir wheelhouse

      - name: List built wheels
        run: ls -lh wheelhouse/

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: wheelhouse/*.whl

  # ------------------------------------------------------------------
  # Publish to PyPI (on tag)
  # ------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [sdist, wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.9
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ------------------------------------------------------------------
  # Summary
  # ------------------------------------------------------------------
  summary:
    name: "Summary"
    needs: [lint, test, security, docs, sdist]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| docs | ${{ needs.docs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| sdist | ${{ needs.sdist.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
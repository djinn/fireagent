<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="40"/>
  <!-- Outer ring -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#475569" stroke-width="2"/>
  <!-- VM boxes -->
  <rect x="100" y="130" width="60" height="50" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <rect x="170" y="130" width="60" height="50" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <rect x="240" y="130" width="60" height="50" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <rect x="135" y="195" width="60" height="50" rx="8" fill="#0f172a" stroke="#f97316" stroke-width="2"/>
  <rect x="205" y="195" width="60" height="50" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <!-- Fire symbol center -->
  <circle cx="200" cy="200" r="15" fill="url(#flame)" filter="url(#glow)"/>
  <path d="M200 185 Q210 170 220 155" fill="none" stroke="url(#flame)" stroke-width="3"/>
  <path d="M200 185 Q190 170 180 155" fill="none" stroke="url(#flame)" stroke-width="3"/>
  <!-- Text label -->
  <text x="200" y="340" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="28" font-weight="700" letter-spacing="4">FIREAGENT</text>
  <text x="200" y="370" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="12" letter-spacing="2">elastic agent sandbox platform</text>
</svg>